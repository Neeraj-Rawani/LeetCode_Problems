name: Generate LeetCode Problem Folders

on:
  push:
    branches:
      - main
    paths:
      # Numbered source files in the repository root, e.g. 20.cpp or 42.py.
      - "*.*"
      # Changes to this automation should also run the workflow.
      - ".github/scripts/generate_leetcode.py"
      - ".github/workflows/leetcode.yml"

  workflow_dispatch:

permissions:
  contents: write

# Queue runs instead of allowing two runs to delete/commit the same files.
concurrency:
  group: leetcode-generator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --upgrade requests

      # A partial failure is allowed to continue so successful problem folders
      # can still be committed. Failed source files are NOT in the manifest.
      - name: Generate LeetCode problem folders
        id: generator
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: python .github/scripts/generate_leetcode.py

      # This runs after a partial generator failure too. The manifest contains
      # only the original files whose problem folders were generated correctly.
      - name: Remove successfully processed root solution files
        if: always() && steps.generator.outcome != 'cancelled'
        shell: bash
        run: |
          set -euo pipefail
          manifest=".git/leetcode_processed_solutions.txt"

          if [[ ! -f "$manifest" ]]; then
            echo "::error::Processing manifest was not created: $manifest"
            exit 1
          fi

          while IFS= read -r file; do
            [[ -n "$file" ]] || continue

            # Manifest entries must be root-level numeric source filenames.
            if [[ "$file" == */* || ! "$file" =~ ^[0-9]+\.[A-Za-z0-9]+$ ]]; then
              echo "::error::Refusing to remove unexpected path: $file"
              exit 1
            fi

            if [[ ! -f "$file" ]]; then
              echo "::error::Processed source file not found: $file"
              exit 1
            fi

            git rm -- "$file"
          done < "$manifest"

      # Commit successful output even when another problem failed.
      - name: Commit generated problem folders
        if: always() && steps.generator.outcome != 'cancelled'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- problems/

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "docs: generate LeetCode problem folders"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Keep the workflow visibly red when at least one problem could not be
      # fetched. Successful problems are already committed; failed inputs remain.
      - name: Report incomplete generation
        if: always() && steps.generator.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::Some LeetCode problems failed. Successful results were committed; failed source files were preserved. Re-run the workflow after the API recovers."
          exit 1
