name: Generate LeetCode Problem

on:
  push:
    branches:
      - main
    paths:
      - "*.*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    # Do not run again on the commit created by this workflow.
    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Generate LeetCode problems
        run: python .github/scripts/generate_leetcode.py

      - name: Remove processed root solution files
        shell: bash
        run: |
          shopt -s nullglob

          for file in ./*; do
            [ -f "$file" ] || continue

            filename="$(basename "$file")"

            # Must look like: 123.ext
            if [[ "$filename" =~ ^[0-9]+\.[^.]+$ ]]; then
              git rm "$file"
            fi
          done

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add problems/

          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "docs: generate LeetCode problem"
            git push
          fi