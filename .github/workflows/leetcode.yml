name: Generate LeetCode Problem

on:
  push:
    branches:
      - main
    paths:
      # Numbered code files in the repository root, e.g. 20.cpp or 42.py.
      - "*.*"
      # Let changes to the automation be tested through Actions too.
      - ".github/scripts/**"
      - ".github/workflows/leetcode.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    # Avoid running again on the commit made by this workflow.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Generate LeetCode problem folders
        run: python .github/scripts/generate_leetcode.py

      # Only delete files explicitly listed by the successful Python run.
      # If Python fails, GitHub Actions skips this step automatically.
      - name: Remove processed root solution files
        shell: bash
        run: |
          set -euo pipefail
          manifest=".git/leetcode_processed_solutions.txt"

          if [[ ! -f "$manifest" ]]; then
            echo "::error::Processing manifest was not created: $manifest"
            exit 1
          fi

          while IFS= read -r file; do
            [[ -n "$file" ]] || continue

            # Extra guard: only allow a root-level numeric filename with one extension.
            filename="$(basename "$file")"
            if [[ "$file" != "$filename" || ! "$filename" =~ ^[0-9]+\.[A-Za-z0-9]+$ ]]; then
              echo "::error::Refusing to remove unexpected path: $file"
              exit 1
            fi

            if [[ ! -f "$file" ]]; then
              echo "::error::Processed source file not found: $file"
              exit 1
            fi

            git rm -- "$file"
          done < "$manifest"

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- problems/

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "docs: generate LeetCode problem"
            git push
          fi
