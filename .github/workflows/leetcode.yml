name: Generate LeetCode Problem

on:
  push:
    branches:
      - main
    paths:
      # Numbered solution files in the repository root, e.g. 20.cpp or 42.py.
      - "*.*"
      # Run the workflow when its automation code changes too.
      - ".github/scripts/**"
      - ".github/workflows/leetcode.yml"

  workflow_dispatch:

permissions:
  contents: write

# Prevent two runs from modifying the same repository at the same time.
concurrency:
  group: leetcode-generator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    # Do not start another run for the commit created by this workflow.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --upgrade requests

      # Python first tries the live API. If it returns a persistent 5xx/timeout,
      # it falls back to the independent daily-updated question database.
      - name: Generate LeetCode problem folders
        run: python -u .github/scripts/generate_leetcode.py

      # This step runs only when every requested problem has been generated.
      # The manifest lists only files that were successfully processed.
      - name: Remove processed root solution files
        shell: bash
        run: |
          set -euo pipefail
          manifest=".git/leetcode_processed_solutions.txt"

          if [[ ! -f "$manifest" ]]; then
            echo "::error::Processing manifest was not created: $manifest"
            exit 1
          fi

          while IFS= read -r file; do
            [[ -n "$file" ]] || continue

            filename="$(basename "$file")"

            # Only permit a root-level numeric filename with one extension.
            if [[ "$file" != "$filename" || ! "$filename" =~ ^[0-9]+\.[A-Za-z0-9]+$ ]]; then
              echo "::error::Refusing to remove unexpected path: $file"
              exit 1
            fi

            if [[ ! -f "$file" ]]; then
              echo "::error::Processed source file not found: $file"
              exit 1
            fi

            git rm -- "$file"
          done < "$manifest"

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- problems/

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "docs: generate LeetCode problem"
            git push
          fi
